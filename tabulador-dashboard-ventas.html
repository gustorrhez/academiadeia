<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabulador de ventas — Academia de IA</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --blue:#0000FF; --blue-link:#3764FF; --cyan:#00B9FF; --navy:#00028F;
    --orange:#FF581B; --mint:#00E696; --violet:#823CFF;
    --ink:#1A1E25; --body2:#364153; --muted:#76777A; --border:#E4EAF3;
    --bg2:#F4F4F4; --bg:#FAFAFA;
    --font: "General Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
  input,select,button{box-sizing:border-box;font-family:var(--font);}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:#BABABA;border-radius:99px;}
  ::-webkit-scrollbar-track{background:#F4F4F4;}
  @keyframes spin{ to { transform:rotate(360deg); } }
  .spin{ animation:spin 0.8s linear infinite; }
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;}
  .header-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;max-width:1440px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand img{height:28px;width:auto;flex:none;}
  .divider{width:1px;height:24px;background:var(--border);flex:none;}
  .badge{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;flex:none;}
  .badge i{width:18px;height:18px;color:#fff;}
  .title{font-size:16px;font-weight:600;color:var(--ink);line-height:1.2;}
  .meta{font-size:12px;color:var(--muted);line-height:1.4;}
  .controls{flex:1;min-width:220px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:360px;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none;}
  #q{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 14px 9px 34px;font-size:14px;outline:none;}
  #colFilter,input[type="date"]{background:var(--bg);border:1px solid var(--border);color:var(--body2);border-radius:8px;padding:9px 10px;font-size:13px;}
  .actions{display:flex;gap:10px;flex:none;}
  button{background:#fff;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 18px 9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;}
  button i{width:14px;height:14px;}
  #refresh{background:var(--blue);border:0;color:#fff;font-weight:600;}
  button:hover{opacity:.9;}
  main{max-width:1440px;margin:0 auto;padding:24px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:0 2px 4px rgba(10,10,10,.06),0 1px 2px rgba(10,10,10,.04);display:flex;gap:14px;align-items:flex-start;}
  .card .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;}
  .card .icon i{width:19px;height:19px;}
  .card .label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .card .value{font-size:26px;font-weight:700;line-height:1.1;}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 4px rgba(10,10,10,.06),0 1px 2px rgba(10,10,10,.04);}
  .status{padding:48px;text-align:center;color:var(--muted);font-size:14px;}
  .status.err{color:var(--orange);}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;margin:0 auto 16px;}
  .table-wrap{overflow:auto;max-height:calc(100vh - 260px);}
  table{border-collapse:collapse;width:100%;}
  th,td{text-align:left;padding:8px 16px;font-size:13px;white-space:nowrap;}
  th{background:#EAF0FF;color:var(--navy);text-transform:uppercase;font-size:11px;letter-spacing:.06em;font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);}
  th .arrow{color:var(--blue);font-size:9px;}
  td{border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:0;}
  tr.odd td{background:#F3F6FF;}
  tr:hover td{background:rgba(0,185,255,.08) !important;}
  td.dup{color:var(--orange);font-weight:600;}
  mark{background:rgba(0,0,255,.15);color:var(--blue);border-radius:2px;padding:0 1px;}
  @media (max-width:900px){
    .controls{width:100%;}
    .search-wrap{max-width:none;min-width:0;flex:1 1 100%;}
    .actions{width:100%;}
    .actions button{flex:1;}
  }
  @media (max-width:640px){
    header{padding:12px 16px;}
    main{padding:16px;}
    th,td{padding:8px 10px;font-size:12.5px;}
  }
</style>
</head>

      <div class="divider"></div>
      <div class="badge"><i data-lucide="layout-dashboard"></i></div>
      <div>
        <div class="title">Tabulador de ventas</div>
        <div class="meta" id="meta">Cargando...</div>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <i data-lucide="search"></i>
        <input id="q" type="search" placeholder="Buscar transaccion, producto, cupon, nombre..." autocomplete="off">
      </div>
      <select id="colFilter"><option value="-1">Todas las columnas</option></select>
      <span id="dateRangeWrap" style="display:none;align-items:center;gap:8px;">
        <input id="dateFrom" type="date">
        <span style="color:#BABABA;font-size:13px;">–</span>
        <input id="dateTo" type="date">
      </span>
    </div>
    <div class="actions">
      <button id="csv"><i data-lucide="download"></i> Descargar CSV</button>
      <button id="refresh"><i data-lucide="refresh-cw"></i> Actualizar</button>
    </div>
  </div>
</header>
<main>
  <div id="cards" class="cards" style="display:none;"></div>
  <div id="content" class="panel"><div class="status"><div class="spinner"></div>Cargando datos del Sheet...</div></div>
</main>
<script>
// -- CONFIGURA AQUI --------------------------------------------
// Pega la URL de tu Google Sheet PUBLICADO EN LA WEB como CSV:
// Archivo -> Compartir -> Publicar en la web -> (elige la hoja) -> CSV
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOr6dTaQEvkPzOY8rTUVNzxcAO53x9kLeTyXP1Fv_G-xJvmM7eNaRyzmlawRcH3w/pub?gid=450868421&single=true&output=csv";
const AUTO_REFRESH_SECONDS = 60; // 0 para desactivar
// --------------------------------------------------------------

let HEAD=[], BODY=[], sortCol=-1, sortDir=1, loading=true, errorMsg="", lastUpdated=null;

function parseCSV(text){
  const rows=[]; let row=[], field="", i=0, q=false;
  while(i<text.length){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==='\r'){} else field+=c; }
    i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function norm(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function findCol(terms){ return HEAD.findIndex(h=>{ const n=norm(h); return terms.some(t=>n.includes(t)); }); }
function parseDate(v){
  if(!v) return null;
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ let [,a,b,y]=m; if(y.length===2) y="20"+y; const d=new Date(+y,+a-1,+b); if(!isNaN(d)) return d; }
  const d2=new Date(s); return isNaN(d2)?null:d2;
}

function populateColFilter(){
  const sel=document.getElementById("colFilter");
  sel.innerHTML='<option value="-1">Todas las columnas</option>'+HEAD.map((h,i)=>'<option value="'+i+'">'+esc(h)+'</option>').join("");
  const dateCol=findCol(["fecha"]);
  document.getElementById("dateRangeWrap").style.display = dateCol>=0 ? "inline-flex" : "none";
}

function currentRows(){
  const q=norm(document.getElementById("q").value.trim());
  const filterCol=+document.getElementById("colFilter").value;
  const dateCol=findCol(["fecha"]);
  const dateFrom=document.getElementById("dateFrom").value;
  const dateTo=document.getElementById("dateTo").value;
  let rows=BODY.filter(r=>{
    if(q){ if(filterCol>=0){ if(!norm(r[filterCol]).includes(q)) return false; } else if(!r.some(c=>norm(c).includes(q))) return false; }
    if(dateCol>=0 && (dateFrom||dateTo)){
      const d=parseDate(r[dateCol]); if(!d) return false;
      if(dateFrom && d<new Date(dateFrom)) return false;
      if(dateTo && d>new Date(dateTo+"T23:59:59")) return false;
    }
    return true;
  });
  if(sortCol>=0){
    rows=rows.slice().sort((a,b)=>{
      const x=a[sortCol]||"", y=b[sortCol]||"";
      const nx=parseFloat(String(x).replace(/[^0-9.\-]/g,"")), ny=parseFloat(String(y).replace(/[^0-9.\-]/g,""));
      let r;
      if(!isNaN(nx)&&!isNaN(ny)&&x!==""&&y!=="") r=nx-ny; else { const nx2=norm(x),ny2=norm(y); r=nx2<ny2?-1:nx2>ny2?1:0; }
      return r*sortDir;
    });
  }
  return rows;
}

function highlight(text,q){ const s=String(text==null?"":text); if(!q) return esc(s); const n=norm(s), idx=n.indexOf(q); if(idx<0) return esc(s);
  return esc(s.slice(0,idx))+"<mark>"+esc(s.slice(idx,idx+q.length))+"</mark>"+esc(s.slice(idx+q.length)); }

function renderCards(){
  const cardsEl=document.getElementById("cards");
  if(!HEAD.length || loading || errorMsg){ cardsEl.style.display="none"; return; }
  const couponCol=findCol(["cupon"]);
  const priceCol=findCol(["monto","precio","total","price"]);
  const dupSet=new Set();
  if(couponCol>=0){ const counts={}; BODY.forEach(r=>{ const v=(r[couponCol]||"").trim(); if(v) counts[v]=(counts[v]||0)+1; });
    Object.keys(counts).forEach(k=>{ if(counts[k]>1) dupSet.add(k); }); }
  const rows=currentRows();
  const cards=[];
  cards.push({label:"Transacciones",value:String(BODY.length),color:"#0000FF",bg:"#E6ECFF",icon:"receipt"});
  if(priceCol>=0){
    const sum=BODY.reduce((acc,r)=>{ const n=parseFloat(String(r[priceCol]||"").replace(/[^0-9.\-]/g,"")); return acc+(isNaN(n)?0:n); },0);
    cards.push({label:"Monto total",value:"$"+sum.toLocaleString("es-MX",{maximumFractionDigits:0}),color:"#009900",bg:"#E3FCEF",icon:"wallet"});
  }
  if(couponCol>=0){
    const has=dupSet.size>0;
    cards.push({label:"Cupones duplicados",value:String(dupSet.size),color:has?"#FF581B":"#00028F",bg:has?"#FFE9E0":"#E6ECFF",icon:has?"alert-triangle":"check-circle-2"});
  }
  cards.push({label:"Mostrando",value:String(rows.length),sub:"de "+BODY.length+" filas",color:"#823CFF",bg:"#F1E9FF",icon:"filter"});
  cardsEl.style.display="grid";
  cardsEl.innerHTML=cards.map(c=>
    '<div class="card" style="border-left:3px solid '+c.color+';">'
    +'<div class="icon" style="background:'+c.bg+';"><i data-lucide="'+c.icon+'" style="color:'+c.color+';"></i></div>'
    +'<div><div class="label">'+c.label+'</div><div class="value" style="color:'+c.color+';">'+c.value+'</div>'
    +(c.sub?'<div class="sub">'+c.sub+'</div>':'')+'</div></div>'
  ).join("");
  if(window.lucide) window.lucide.createIcons();
}

function render(){
  const content=document.getElementById("content"), meta=document.getElementById("meta");
  renderCards();
  if(loading){ content.innerHTML='<div class="status"><div class="spinner"></div>Cargando datos del Sheet...</div>'; meta.textContent="Cargando..."; return; }
  if(errorMsg){ content.innerHTML='<div class="status err">'+esc(errorMsg)+'</div>'; meta.textContent=""; return; }
  if(!HEAD.length){ content.innerHTML='<div class="status">El Sheet esta vacio.</div>'; meta.textContent="0 filas"; return; }
  const q=norm(document.getElementById("q").value.trim());
  const couponCol=findCol(["cupon"]);
  const dupSet=new Set();
  if(couponCol>=0){ const counts={}; BODY.forEach(r=>{const v=(r[couponCol]||"").trim(); if(v) counts[v]=(counts[v]||0)+1;});
    Object.keys(counts).forEach(k=>{ if(counts[k]>1) dupSet.add(k); }); }
  const rows=currentRows();
  if(!rows.length){ content.innerHTML='<div class="status">No hay filas que coincidan con los filtros actuales.</div>'; meta.textContent="Mostrando 0 de "+BODY.length; return; }
  let html='<div class="table-wrap"><table><thead><tr>'+HEAD.map((h,c)=>{
    const ar=sortCol===c?'<span class="arrow">'+(sortDir>0?'▲':'▼')+'</span>':'';
    return '<th data-c="'+c+'">'+esc(h)+' '+ar+'</th>'; }).join('')+'</tr></thead><tbody>';
  html+=rows.map((r,ri)=>'<tr class="'+(ri%2===1?'odd':'')+'">'+HEAD.map((_,c)=>{
    const val=r[c]||""; const dup=(c===couponCol && dupSet.has(val.trim()));
    return '<td class="'+(dup?'dup':'')+'"'+(dup?' title="Cupon repetido en mas de un comprador"':'')+'>'+highlight(val,q)+'</td>';
  }).join('')+'</tr>').join('');
  html+='</tbody></table></div>';
  content.innerHTML=html;
  content.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{
    const c=+th.dataset.c; if(sortCol===c) sortDir=-sortDir; else { sortCol=c; sortDir=1; } render(); }));
  meta.textContent="Mostrando "+rows.length+" de "+BODY.length+" · "+(lastUpdated?lastUpdated.toLocaleTimeString('es-MX'):"")+"";
}

function toCSV(rows){ return [HEAD].concat(rows).map(r=>r.map(c=>{ const s=String(c==null?"":c);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); }

function downloadCSV(){ const blob=new Blob([toCSV(currentRows())],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tabulador_export.csv"; a.click(); URL.revokeObjectURL(a.href); }

async function load(){
  const refreshBtn=document.getElementById("refresh");
  loading = HEAD.length===0;
  errorMsg="";
  refreshBtn.innerHTML='<i data-lucide="refresh-cw" class="spin"></i> Actualizando...';
  if(window.lucide) window.lucide.createIcons();
  render();
  if(SHEET_CSV_URL.indexOf("PEGA_AQUI")===0){ errorMsg="Falta configurar SHEET_CSV_URL en el HTML."; loading=false; render(); return; }
  try{
    const bust=(SHEET_CSV_URL.indexOf('?')>=0?'&':'?')+'_t='+Date.now();
    const res=await fetch(SHEET_CSV_URL+bust);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const rows=parseCSV(await res.text());
    HEAD=rows[0]||[]; BODY=rows.slice(1);
    lastUpdated=new Date();
    loading=false;
    populateColFilter();
  }catch(e){
    loading=false;
    errorMsg="No se pudo cargar el Sheet: "+e.message;
  }
  refreshBtn.innerHTML='<i data-lucide="refresh-cw"></i> Actualizar';
  render();
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("colFilter").addEventListener("change", render);
document.getElementById("dateFrom").addEventListener("change", render);
document.getElementById("dateTo").addEventListener("change", render);
document.getElementById("csv").addEventListener("click", downloadCSV);
document.getElementById("refresh").addEventListener("click", load);

load();
if(AUTO_REFRESH_SECONDS>0) setInterval(load, AUTO_REFRESH_SECONDS*1000);
</script>
</body>
</html>
