  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

61cedf5c\") format(\"woff2\");          font-weight: 700; font-style: normal; font-display: swap; }\n\n:root {\n  /* =========================================================\n     COLORS — Core palette\n     Brand is built on a single electric blue (#0000FF), pure\n     black, pure white, plus a warm-neutral gray scale for UI.\n     Keep saturated colors scarce — blue is the hero.\n     ========================================================= */\n\n  /* Brand — Primary blues */\n  --aia-blue:         #0000FF;   /* Brand / primary */\n  --aia-blue-link:    #3764FF;   /* Link / secondary */\n  --aia-cyan:         #00B9FF;   /* Cyan accent */\n  --aia-navy:         #00028F;   /* Deep navy */\n\n  /* Back-compat aliases (buttons / pills) */\n  --aia-blue-hover:   var(--aia-blue-link);\n  --aia-blue-press:   var(--aia-navy);\n  --aia-blue-tint:    #E6ECFF;\n  --aia-blue-tint-2:  #CCD9FF;\n\n  /* Accents — used sparingly for CTAs and highlights */\n  --aia-orange:       #FF581B;   /* Hover / attention */\n  --aia-mint:         #00E696;   /* CTA default / success-alt */\n  --aia-violet:       #823CFF;   /* Highlight */\n\n  /* System */\n  --aia-error:        #FF0000;\n  --aia-warning:      #FFD400;\n  --aia-success:      #009900;\n  --aia-success-alt:  #00E696;\n  --aia-danger:       var(--aia-error);\n  --aia-info:         var(--aia-blue);\n\n  /* Neutrals ramp — ink → body → borders → section-bg → page-bg */\n  --aia-black:        #000000;   /* Ink */\n  --aia-ink:          #000000;\n  --aia-gray-900:     #1A1E25;   /* Body */\n  --aia-gray-800:     #364153;   /* Secondary body */\n  --aia-gray-700:     #364153;\n  --aia-gray-600:     #76777A;   /* Muted */\n  --aia-gray-500:     #76777A;\n  --aia-gray-400:     #BABABA;   /* Disabled / borders */\n  --aia-gray-300:     #BABABA;\n  --aia-gray-200:     #F6F7FB;   /* Borders / dividers */\n  --aia-gray-100:     #F4F4F4;   /* Section bg */\n  --aia-gray-50:      #FAFAFA;   /* Page bg */\n  --aia-white:        #FFFFFF;\n\n  /* Gradients */\n  --aia-gradient-signature: linear-gradient(90deg, #16A4FF 0%, #7A44FF 100%); /* @kind color */\n  --aia-gradient-radial-glow: radial-gradient(closest-side, rgba(85,192,198,0.30), rgba(85,192,198,0) 75%), #FAFAFA; /* @kind color */\n\n  /* =========================================================\n     SEMANTIC TOKENS — always reference these in components\n     ========================================================= */\n\n  /* Surfaces */\n  --surface-0:        var(--aia-white);      /* page bg */\n  --surface-1:        var(--aia-gray-50);    /* subtle panel */\n  --surface-2:        var(--aia-gray-100);   /* raised panel */\n  --surface-inverse:  var(--aia-black);      /* dark sections */\n  --surface-brand:    var(--aia-blue);       /* blue section */\n  --surface-tint:     var(--aia-blue-tint);  /* tinted highlight */\n\n  /* Foreground */\n  --fg-1:             var(--aia-ink);        /* primary text */\n  --fg-2:             var(--aia-gray-700);   /* secondary text */\n  --fg-3:             var(--aia-gray-500);   /* tertiary / meta */\n  --fg-muted:         var(--aia-gray-400);   /* disabled / placeholder */\n  --fg-on-brand:      var(--aia-white);      /* on blue */\n  --fg-on-dark:       var(--aia-white);\n  --fg-link:          var(--aia-blue);\n\n  /* Borders */\n  --border-1:         var(--aia-gray-200);   /* hairline */\n  --border-2:         var(--aia-gray-300);   /* stronger */\n  --border-strong:    var(--aia-ink);        /* emphatic black stroke */\n  --border-brand:     var(--aia-blue);\n\n  /* Focus */\n  --focus-ring:       var(--aia-blue);\n  --focus-ring-offset: var(--aia-white);\n\n  /* Brand shadow uses real brand blue */\n  --shadow-brand-color: rgba(0,0,255,0.22);\n\n  /* =========================================================\n     TYPOGRAPHY\n     ========================================================= */\n  --font-sans: \"General Sans\", ui-sans-serif, system-ui, -apple-system,\n               \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Raleway\", \"General Sans\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* Weights */\n  --fw-extralight: 200; /* @kind font */\n  --fw-light:      300; /* @kind font */\n  --fw-regular:    400; /* @kind font */\n  --fw-medium:     500; /* @kind font */\n  --fw-semibold:   600; /* @kind font */\n  --fw-bold:       700; /* @kind font */\n\n  /* Fluid display sizes (use clamp for hero type) */\n  --fs-display-xl: clamp(3rem, 5vw + 2rem, 6.5rem); /* @kind other */ /* hero */\n  --fs-display-lg: clamp(2.5rem, 3.5vw + 1.5rem, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 2.5vw + 1rem, 3.25rem); /* @kind other */\n\n  /* Fixed headings — per brand doc */\n  --fs-h1: 2.5rem;     /* 40 — in brand blue */\n  --fs-h2: 2rem;       /* 32 */\n  --fs-h3: 1.625rem;   /* 26 */\n  --fs-h4: 1.375rem;   /* 22 */\n  --fs-h5: 1.125rem;   /* 18 */\n  --fs-h6: 1rem;       /* 16 */\n\n  /* Body */\n  --fs-body:    1rem;    /* 16/24 body */\n  --fs-secondary: 0.875rem; /* 14/21 secondary */\n  --fs-caption: 0.75rem; /* 12/17 caption */\n  --fs-base:    var(--fs-body);\n  --fs-lg:      1.25rem;\n  --fs-sm:      var(--fs-secondary);\n  --fs-xs:      var(--fs-caption);\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind font */ /* display */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.3; /* @kind font */\n  --lh-body:    1.55; /* @kind font */\n  --lh-relaxed: 1.7; /* @kind font */\n\n  /* Letter spacing */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-heading: -0.01em; /* @kind font */\n  --ls-body:     0; /* @kind font */\n  --ls-caps:     0.08em; /* @kind font */\n\n  /* =========================================================\n     SPACING — 4px base grid\n     ========================================================= */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n  --space-20: 5rem;     /* 80 */\n  --space-24: 6rem;     /* 96 */\n  --space-32: 8rem;     /* 128 */\n\n  /* Radii */\n  --radius-none: 0;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-2xl:  32px;\n  --radius-pill: 999px;\n\n  /* Shadows — soft, low-elevation; Academia doesn't lean heavy */\n  --shadow-xs: 0 1px 2px rgba(10,10,10,0.04);\n  --shadow-sm: 0 2px 4px rgba(10,10,10,0.06), 0 1px 2px rgba(10,10,10,0.04);\n  --shadow-md: 0 8px 20px rgba(10,10,10,0.08), 0 2px 6px rgba(10,10,10,0.04);\n  --shadow-lg: 0 20px 40px rgba(10,10,10,0.10), 0 6px 14px rgba(10,10,10,0.06);\n  --shadow-brand: 0 10px 30px rgba(0,0,255,0.22);\n\n  /* Motion */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   400ms; /* @kind other */\n\n  /* Containers */\n  --container-sm: 640px; /* @kind spacing */\n  --container-md: 768px; /* @kind spacing */\n  --container-lg: 1024px; /* @kind spacing */\n  --container-xl: 1280px; /* @kind spacing */\n  --container-2xl: 1440px; /* @kind spacing */\n}\n\n/* =========================================================\n   ELEMENT DEFAULTS — apply <link rel=\"stylesheet\" …> then\n   these cascade automatically.\n   ========================================================= */\nhtml {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\nbody {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-base);\n  line-height: var(--lh-body);\n  color: var(--fg-1);\n  background: var(--surface-0);\n  letter-spacing: var(--ls-body);\n}\n\nh1, h2, h3, h4, h5, h6 { font-family: var(--font-sans); color: var(--fg-1); margin: 0; text-wrap: balance; }\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-bold);     line-height: var(--lh-heading); letter-spacing: var(--ls-heading); color: var(--aia-blue); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-bold);     line-height: var(--lh-heading); letter-spacing: var(--ls-heading); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }\nh4 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }\nh5 { font-size: var(--fs-h5); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }\nh6 { font-size: var(--fs-h6); font-weight: var(--fw-semibold); line-height: var(--lh-snug); letter-spacing: var(--ls-caps); text-transform: uppercase; }\n\np { margin: 0; text-wrap: pretty; }\np + p { margin-top: var(--space-4); }\n\nsmall { font-size: var(--fs-sm); color: var(--fg-2); }\nstrong, b { font-weight: var(--fw-semibold); }\n\na { color: var(--fg-link); text-decoration: none; text-underline-offset: 2px; transition: color var(--dur-fast) var(--ease-out); }\na:hover { text-decoration: underline; }\n\ncode, kbd, pre, samp { font-family: var(--font-mono); font-size: 0.925em; }\ncode {\n  background: var(--aia-gray-100);\n  border: 1px solid var(--border-1);\n  border-radius: var(--radius-sm);\n  padding: 0.1em 0.35em;\n}\n\nhr { border: 0; border-top: 1px solid var(--border-1); margin: var(--space-8) 0; }\n\n/* Selection — brand blue */\n::selection { background: var(--aia-blue); color: #fff; }\n\n/* Utility classes referenced by cards / demos */\n.display-xl { font-size: var(--fs-display-xl); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: var(--ls-display); }\n.display-lg { font-size: var(--fs-display-lg); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: var(--ls-display); }\n.display-md { font-size: var(--fs-display-md); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: var(--ls-display); }\n.eyebrow    { font-size: var(--fs-xs); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--aia-blue); }\n.lead       { font-size: var(--fs-lg); color: var(--fg-2); line-height: var(--lh-relaxed); font-weight: var(--fw-regular); }\n.meta       { font-size: var(--fs-sm); color: var(--fg-3); }\n\n\n/* ------- Section glow (soft brand-color blobs in corners) ------- */\n.section-glow {\n  position: relative;\n  overflow: hidden;\n  isolation: isolate;\n}\n.section-glow::before,\n.section-glow::after {\n  content: \"\";\n  position: absolute;\n  pointer-events: none;\n  z-index: 0;\n  border-radius: 50%;\n  filter: blur(60px);\n  opacity: 1;\n}\n/* Blue blob — top-left */\n.section-glow::before {\n  width: 520px;\n  height: 520px;\n  top: -180px;\n  left: -160px;\n  background: radial-gradient(circle, rgba(0, 0, 255, 0.55) 0%, rgba(0, 0, 255, 0.18) 38%, rgba(0, 0, 255, 0) 70%);\n}\n/* Orange blob — bottom-right */\n.section-glow::after {\n  width: 560px;\n  height: 560px;\n  bottom: -200px;\n  right: -180px;\n  background: radial-gradient(circle, rgba(255, 88, 27, 0.50) 0%, rgba(255, 88, 27, 0.18) 38%, rgba(255, 88, 27, 0) 70%);\n}\n/* Variant: blue right / orange left */\n.section-glow.flip::before {\n  left: auto;\n  right: -160px;\n}\n.section-glow.flip::after {\n  right: auto;\n  left: -180px;\n}\n.section-glow > * {\n  position: relative;\n  z-index: 1;\n}\n<\u002Fstyle>\n  <script src=\"303f9e41-455f-4bab-b626-81114dabd65b\"><\u002Fscript>\n  <script src=\"fb0a2828-b54c-4326-84e6-68f8a94496e5\"><\u002Fscript>\n  <style>\n    body{margin:0;background:#FAFAFA;font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n    *{box-sizing:border-box}\n    ::selection{background:#00B9FF;color:#fff}\n    a{color:#3764FF}\n    a:hover{color:#0000FF}\n    ::-webkit-scrollbar{width:8px;height:8px}\n    ::-webkit-scrollbar-thumb{background:#BABABA;border-radius:8px}\n    .sck-toast{animation:sckFade 1.4s ease forwards}\n    @keyframes sckFade{0%{opacity:0;transform:translateY(4px)}12%{opacity:1;transform:translateY(0)}82%{opacity:1}100%{opacity:0}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;width:100%\">\n\n  <aside style=\"flex:none;width:280px;background:#fff;border-right:1px solid #E4EAF3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto\">\n    <div style=\"padding:24px 20px 16px;border-bottom:1px solid #E4EAF3\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n        <div style=\"width:22px;height:22px;border-radius:6px;background:#0000FF;flex:none\"><\u002Fdiv>\n        <span style=\"font:700 15px/1.2 'General Sans',sans-serif;color:#1A1E25\">Academia de IA<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:500 12px/1.3 'General Sans',sans-serif;color:#76777A\">Dashboard de SCKs<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:14px 16px 6px\">\n      <div style=\"font:600 10.5px/1.2 'General Sans',sans-serif;color:#BABABA;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px\">Todos<\u002Fdiv>\n      <sc-for list=\"{{ totalsRow }}\" as=\"row\" hint-placeholder-count=\"1\">\n        <div style=\"{{ allButtonStyle }}\" sc-camel-on-click=\"{{ selectAll }}\">\n          <span>Ver todo<\u002Fspan>\n          <span style=\"{{ countPillStyle }}\">{{ totalCount }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"4\">\n      <div style=\"padding:10px 16px 4px\">\n        <div style=\"font:600 10.5px/1.2 'General Sans',sans-serif;color:#BABABA;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px\">{{ cat.name }}<\u002Fdiv>\n        <sc-for list=\"{{ cat.courses }}\" as=\"course\" hint-placeholder-count=\"3\">\n          <div style=\"{{ course.tabStyle }}\" sc-camel-on-click=\"{{ course.onClick }}\">\n            <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ course.name }}<\u002Fspan>\n            <span style=\"{{ course.pillStyle }}\">{{ course.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"margin-top:auto;padding:16px 20px;border-top:1px solid #E4EAF3;font:400 11px/1.5 'General Sans',sans-serif;color:#BABABA\">\n      Solo consulta · datos cargados desde el Excel de programas\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;padding:32px 40px 60px;max-width:1280px\">\n\n    <div style=\"margin-bottom:24px\">\n      <h1 style=\"margin:0 0 6px;font:700 30px/1.15 'General Sans',sans-serif;color:#1A1E25;letter-spacing:-0.01em\">{{ headerTitle }}<\u002Fh1>\n      <p style=\"margin:0;font:400 15px/1.5 'General Sans',sans-serif;color:#364153;max-width:640px\">Busca un código SCK, un asesor o un canal, y copia el link de página de venta o checkout con un clic. <strong style=\"color:#1A1E25\">Soporte:<\u002Fstrong> el canal de cada código está siempre visible junto al SCK.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;margin-bottom:24px\">\n      <input type=\"text\" value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Buscar por curso, SCK, asesor o canal…\" style=\"width:100%;max-width:560px;padding:13px 16px 13px 42px;border-radius:10px;border:1px solid #E4EAF3;background:#fff;font:400 15px/1.3 'General Sans',sans-serif;color:#1A1E25;outline:none;transition:border-color 120ms cubic-bezier(0.22,1,0.36,1),box-shadow 120ms cubic-bezier(0.22,1,0.36,1)\" style-focus=\"border-color:#0000FF;box-shadow:0 0 0 3px rgba(0,0,255,0.12)\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none\">\n        <circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#76777A\" stroke-width=\"2\"><\u002Fcircle>\n        <line x1=\"21\" y1=\"21\" x2=\"16.2\" y2=\"16.2\" stroke=\"#76777A\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isSearching }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:14px;font:500 13px/1.3 'General Sans',sans-serif;color:#76777A\">{{ resultsSummary }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ !isSearching }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:14px\">\n        <h2 style=\"margin:0;font:600 18px/1.2 'General Sans',sans-serif;color:#1A1E25\">{{ activeCourseName }}<\u002Fh2>\n        <span style=\"font:500 13px/1.2 'General Sans',sans-serif;color:#76777A\">{{ activeCourseCategory }} · {{ activeCourseCount }} SCKs<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"background:#fff;border:1px solid #E4EAF3;border-radius:14px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)\">\n      <div style=\"display:grid;grid-template-columns:minmax(220px,1.5fr) 100px 150px minmax(200px,1.4fr) minmax(200px,1.4fr);gap:0;padding:12px 20px;background:#F4F4F4;border-bottom:1px solid #E4EAF3;min-width:900px\">\n        <div style=\"font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;text-transform:uppercase;letter-spacing:.04em\">Asesor / Canal<\u002Fdiv>\n        <div style=\"font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;text-transform:uppercase;letter-spacing:.04em\">SCK<\u002Fdiv>\n        <div style=\"font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;text-transform:uppercase;letter-spacing:.04em\">Uso<\u002Fdiv>\n        <div style=\"font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;text-transform:uppercase;letter-spacing:.04em\">Página de venta<\u002Fdiv>\n        <div style=\"font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;text-transform:uppercase;letter-spacing:.04em\">Checkout<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ visibleRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n        <sc-if value=\"{{ row.isSoporte }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ row.soporteRowStyle }}\" style-hover=\"background:#FAFAFA;min-width:900px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\">\n              <sc-if value=\"{{ row.showCourseBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font:600 10.5px/1.2 'General Sans',sans-serif;color:#3764FF\">{{ row.courseName }}<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"font:600 10px/1.2 'General Sans',sans-serif;color:#00028F;background:rgba(0,185,255,0.12);border-radius:999px;padding:3px 8px;width:fit-content;text-transform:uppercase;letter-spacing:.03em\">{{ row.asesor }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;min-width:0;grid-column:2 / -1\">\n              <a href=\"{{ row.supportLink }}\" target=\"_blank\" rel=\"noopener\" style=\"font:500 13px/1.3 'General Sans',sans-serif;color:#3764FF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0\" title=\"{{ row.supportLink }}\">{{ row.supportLabel }}<\u002Fa>\n              <button sc-camel-on-click=\"{{ row.copySupport }}\" style=\"flex:none;width:28px;height:28px;border-radius:7px;border:1px solid #E4EAF3;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0\" style-hover=\"background:#F4F4F4;border-color:#BABABA\" title=\"Copiar link\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" stroke=\"#364153\" stroke-width=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\" stroke=\"#364153\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ !row.isSoporte }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"{{ row.rowStyle }}\" style-hover=\"background:#FAFAFA;min-width:900px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0;padding-right:8px\">\n            <sc-if value=\"{{ row.showCourseBadge }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font:600 10.5px/1.2 'General Sans',sans-serif;color:#3764FF\">{{ row.courseName }}<\u002Fspan>\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n              <span style=\"font:600 14px/1.3 'General Sans',sans-serif;color:#1A1E25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ row.asesor }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"{{ row.badgeStyle }}\">{{ row.badgeLabel }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center\">\n            <span style=\"font:600 12.5px/1.2 ui-monospace,Menlo,monospace;color:#00028F;background:#F4F4F4;border-radius:6px;padding:4px 8px\">{{ row.id }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;min-width:0\">\n            <span style=\"font:400 13px/1.4 'General Sans',sans-serif;color:#364153;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" title=\"{{ row.uso }}\">{{ row.uso }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:6px;min-width:0\">\n            <sc-if value=\"{{ row.hasVenta }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ row.ventaHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font:500 13px/1.3 'General Sans',sans-serif;color:#3764FF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0\" title=\"{{ row.ventaHref }}\">{{ row.ventaLabel }}<\u002Fa>\n              <button sc-camel-on-click=\"{{ row.copyVenta }}\" style=\"flex:none;width:28px;height:28px;border-radius:7px;border:1px solid #E4EAF3;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0\" style-hover=\"background:#F4F4F4;border-color:#BABABA\" title=\"Copiar link\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" stroke=\"#364153\" stroke-width=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\" stroke=\"#364153\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !row.hasVenta }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font:400 13px/1.3 'General Sans',sans-serif;color:#BABABA\">No disponible<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:6px;min-width:0\">\n            <sc-if value=\"{{ row.hasCheckout }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ row.checkoutHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font:500 13px/1.3 'General Sans',sans-serif;color:#3764FF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0\" title=\"{{ row.checkoutHref }}\">{{ row.checkoutLabel }}<\u002Fa>\n              <button sc-camel-on-click=\"{{ row.copyCheckout }}\" style=\"flex:none;width:28px;height:28px;border-radius:7px;border:1px solid #E4EAF3;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0\" style-hover=\"background:#F4F4F4;border-color:#BABABA\" title=\"Copiar link\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\" stroke=\"#364153\" stroke-width=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\" stroke=\"#364153\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !row.hasCheckout }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font:400 13px/1.3 'General Sans',sans-serif;color:#BABABA\">No disponible<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:60px 20px;text-align:center;color:#76777A;font:400 14px/1.4 'General Sans',sans-serif\">No encontramos SCKs que coincidan con \"{{ query }}\".<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ null }}\">\n    <div class=\"sck-toast\" style=\"position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1A1E25;color:#fff;padding:10px 18px;border-radius:10px;font:500 13px/1.2 'General Sans',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    query: '',\n    activeCourseId: null,\n    toast: null,\n    _toastTimer: null\n  };\n\n  componentDidMount() {\n    const wait = () => {\n      if (window.SCK_DATA) {\n        this.data = window.SCK_DATA;\n        this.setState({ activeCourseId: this.data[0].id });\n      } else {\n        setTimeout(wait, 50);\n      }\n    };\n    wait();\n  }\n\n  channelBadge(row) {\n    return row.isVendedor\n      ? { label: 'Vendedor', style: 'font:600 10px/1.2 \\'General Sans\\',sans-serif;color:#823CFF;background:rgba(130,60,255,0.1);border-radius:999px;padding:3px 8px;width:fit-content;text-transform:uppercase;letter-spacing:.03em' }\n      : { label: 'Canal', style: 'font:600 10px/1.2 \\'General Sans\\',sans-serif;color:#76777A;background:#F4F4F4;border-radius:999px;padding:3px 8px;width:fit-content;text-transform:uppercase;letter-spacing:.03em' };\n  }\n\n  shortLabel(url) {\n    if (!url) return '';\n    return url.replace(/^https?:\\/\\/[^/]+/, '') || url.replace(/^https?:\\/\\//, '');\n  }\n\n  copyToClipboard(text, label) {\n    if (!text) return;\n    const done = () => {\n      clearTimeout(this.state._toastTimer);\n      const timer = setTimeout(() => this.setState({ toast: null }), 1400);\n      this.setState({ toast: 'Copiado: ' + label, _toastTimer: timer });\n    };\n    const fallback = () => {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.style.position = 'fixed';\n      ta.style.left = '-9999px';\n      document.body.appendChild(ta);\n      ta.focus();\n      ta.select();\n      try { document.execCommand('copy'); } catch (e) {}\n      document.body.removeChild(ta);\n      done();\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done).catch(fallback);\n    } else {\n      fallback();\n    }\n  }\n\n  buildRow(item, courseName, showCourseBadge) {\n    if (item.isSoporte) {\n      return {\n        isSoporte: true,\n        asesor: item.asesor || 'Soporte',\n        courseName,\n        showCourseBadge,\n        soporteRowStyle: 'display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(400px,1fr);gap:0;padding:14px 20px;border-bottom:1px solid #E4EAF3;transition:background 120ms cubic-bezier(0.22,1,0.36,1);min-width:900px;align-items:center',\n        supportLink: item.supportLink,\n        supportLabel: this.shortLabel(item.supportLink) || item.supportLink,\n        copySupport: () => this.copyToClipboard(item.supportLink, 'link de soporte')\n      };\n    }\n    const badge = this.channelBadge(item);\n    const hasVenta = !!(item.ventaBitly || item.ventaPersonalizado);\n    const ventaHref = item.ventaBitly || item.ventaPersonalizado;\n    const hasCheckout = !!(item.checkoutBitly || item.checkoutPersonalizado);\n    const checkoutHref = item.checkoutBitly || item.checkoutPersonalizado;\n    return {\n      isSoporte: false,\n      asesor: item.asesor || '—',\n      id: item.id || '—',\n      uso: item.uso || '—',\n      courseName,\n      showCourseBadge,\n      badgeLabel: badge.label,\n      badgeStyle: badge.style,\n      rowStyle: 'display:grid;grid-template-columns:minmax(220px,1.5fr) 100px 150px minmax(200px,1.4fr) minmax(200px,1.4fr);gap:0;padding:14px 20px;border-bottom:1px solid #E4EAF3;transition:background 120ms cubic-bezier(0.22,1,0.36,1);min-width:900px',\n      hasVenta,\n      ventaHref,\n      ventaLabel: this.shortLabel(ventaHref),\n      copyVenta: () => this.copyToClipboard(ventaHref, 'link de página de venta'),\n      hasCheckout,\n      checkoutHref,\n      checkoutLabel: this.shortLabel(checkoutHref),\n      copyCheckout: () => this.copyToClipboard(checkoutHref, 'link de checkout')\n    };\n  }\n\n  renderVals() {\n    const data = this.data || [];\n    const query = this.state.query.trim().toLowerCase();\n    const isSearching = query.length > 0;\n\n    const totalCount = data.reduce((sum, c) => sum + c.items.length, 0);\n\n    const categoriesOrder = [];\n    const byCategory = {};\n    data.forEach(course => {\n      if (!byCategory[course.category]) {\n        byCategory[course.category] = [];\n        categoriesOrder.push(course.category);\n      }\n      byCategory[course.category].push(course);\n    });\n\n    const categories = categoriesOrder.map(catName => ({\n      name: catName,\n      courses: byCategory[catName].map(course => {\n        const active = !isSearching && course.id === this.state.activeCourseId;\n        return {\n          name: course.name,\n          count: course.items.length,\n          onClick: () => this.setState({ activeCourseId: course.id, query: '' }),\n          tabStyle: `display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font:${active ? '600' : '500'} 13.5px/1.3 'General Sans',sans-serif;color:${active ? '#0000FF' : '#1A1E25'};background:${active ? 'rgba(0,0,255,0.08)' : 'transparent'};transition:background 120ms cubic-bezier(0.22,1,0.36,1)`,\n          pillStyle: `font:600 11px/1.2 'General Sans',sans-serif;color:${active ? '#0000FF' : '#76777A'};background:${active ? '#fff' : '#F4F4F4'};border-radius:999px;padding:2px 7px;flex:none`\n        };\n      })\n    }));\n\n    let visibleRows = [];\n    let activeCourseName = '';\n    let activeCourseCategory = '';\n    let activeCourseCount = 0;\n\n    if (isSearching) {\n      data.forEach(course => {\n        course.items.forEach(item => {\n          const haystack = [course.name, item.asesor, item.uso, item.id].join(' ').toLowerCase();\n          if (haystack.includes(query)) {\n            visibleRows.push(this.buildRow(item, course.name, true));\n          }\n        });\n      });\n    } else {\n      const course = data.find(c => c.id === this.state.activeCourseId) || data[0];\n      if (course) {\n        activeCourseName = course.name;\n        activeCourseCategory = course.category;\n        activeCourseCount = course.items.length;\n        visibleRows = course.items.map(item => this.buildRow(item, course.name, false));\n      }\n    }\n\n    return {\n      categories,\n      totalsRow: [1],\n      totalCount,\n      allButtonStyle: `display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font:${!isSearching && !this.state.activeCourseId ? '600' : '500'} 13.5px/1.3 'General Sans',sans-serif;color:#1A1E25;background:transparent`,\n      countPillStyle: `font:600 11px/1.2 'General Sans',sans-serif;color:#76777A;background:#F4F4F4;border-radius:999px;padding:2px 7px`,\n      selectAll: () => { if (data[0]) this.setState({ activeCourseId: data[0].id, query: '' }); },\n      headerTitle: 'Dashboard de SCKs por canal y vendedor',\n      query: this.state.query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      isSearching,\n      resultsSummary: `${visibleRows.length} resultado${visibleRows.length === 1 ? '' : 's'} para \"${this.state.query}\"`,\n      activeCourseName,\n      activeCourseCategory,\n      activeCourseCount,\n      visibleRows,\n      noResults: isSearching && visibleRows.length === 0,\n      toast: this.state.toast\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
